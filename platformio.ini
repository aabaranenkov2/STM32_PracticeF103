; PlatformIO Project Configuration File
; Учебный проект для STM32F103C8T6 (Blue Pill)
; Для практики до прихода NUCLEO-G491RE

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; Протокол загрузки через внешний ST-Link v2
upload_protocol = stlink

; Скорость монитора (для отладки через Serial)
monitor_speed = 115200

; Автоматический поиск порта для монитора
monitor_port = auto

; Флаги компиляции
build_flags = 
    -Os                    ; Оптимизация размера
    -Wall                  ; Все предупреждения
    -Wextra                ; Дополнительные предупреждения



