; STM32F103C8T6 firmware configuration
; Programming and debugging: ST-Link V2

[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink

build_src_filter =
    +<main.c>

build_flags =
    -std=c11
    -Os
    -Wall
    -Wextra
    -Werror=return-type

[env:bluepill_f103c8_clone]
extends = env:bluepill_f103c8
upload_flags =
    -c
    set CPUTAPID 0x2BA01477

[env:selftest_f103c8]
extends = env:bluepill_f103c8
build_src_filter =
    +<board_self_test.c>

[env:selftest_f103c8_clone]
extends = env:bluepill_f103c8_clone
build_src_filter =
    +<board_self_test.c>

[env:selftest_f103c6]
platform = ststm32
board = genericSTM32F103C6
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink

build_src_filter =
    +<board_self_test.c>

build_flags =
    -std=c11
    -Os
    -Wall
    -Wextra
    -Werror=return-type

[env:selftest_f103c6_clone]
extends = env:selftest_f103c6
upload_flags =
    -c
    set CPUTAPID 0x2BA01477

[env:rs485_f103c8]
extends = env:bluepill_f103c8
build_src_filter =
    +<rs485_test.c>

[env:rs485_f103c8_clone]
extends = env:bluepill_f103c8_clone
build_src_filter =
    +<rs485_test.c>

[env:rs485_f103c6]
extends = env:selftest_f103c6
build_src_filter =
    +<rs485_test.c>

[env:rs485_f103c6_clone]
extends = env:selftest_f103c6_clone
build_src_filter =
    +<rs485_test.c>

[env:rs485_tx_f103c8]
extends = env:bluepill_f103c8
build_src_filter =
    +<rs485_tx_test.c>

[env:rs485_tx_f103c8_clone]
extends = env:bluepill_f103c8_clone
build_src_filter =
    +<rs485_tx_test.c>

[env:rs485_tx_f103c6]
extends = env:selftest_f103c6
build_src_filter =
    +<rs485_tx_test.c>

[env:rs485_tx_f103c6_clone]
extends = env:selftest_f103c6_clone
build_src_filter =
    +<rs485_tx_test.c>

[env:rs485_dc_f103c8_clone]
extends = env:bluepill_f103c8_clone
build_src_filter =
    +<rs485_dc_test.c>

[env:lot_sensor_f103c8]
extends = env:bluepill_f103c8
board_upload.maximum_size = 64512
build_src_filter =
    +<lot_sensor.c>

[env:lot_sensor_f103c8_clone]
extends = env:bluepill_f103c8_clone
board_upload.maximum_size = 64512
build_src_filter =
    +<lot_sensor.c>

[env:lot_sensor_f103c6]
extends = env:selftest_f103c6
board_upload.maximum_size = 31744
build_src_filter =
    +<lot_sensor.c>

[env:lot_sensor_f103c6_clone]
extends = env:selftest_f103c6_clone
board_upload.maximum_size = 31744
build_src_filter =
    +<lot_sensor.c>

[env:ground_sensor_test_f103c8]
extends = env:bluepill_f103c8
build_src_filter =
    +<ground_sensor_test.c>

[env:ground_sensor_test_f103c8_clone]
